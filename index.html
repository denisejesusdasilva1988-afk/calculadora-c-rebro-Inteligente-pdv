    <style>
      *, *:before, *:after {

      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }

  <body translate="no">
    <div id="root">
      <div class="app-preloader" id="app-preloader-box">
        <div class="preloader-spinner"></div>
        <div class="preloader-title">Calculadora Cérebro PDV 🧠</div>
        <div class="preloader-subtitle">Carregando o aplicativo...</div>
        <button type="button" class="preloader-btn" id="preloader-reload-btn" onclick="clearAppCacheAndReload()">
          🔄 Recarregar e Limpar Memória
        </button>
      </div>
    </div>
    <script>
      function clearAppCacheAndReload() {
        try {
          localStorage.clear();
          sessionStorage.clear();
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if (typeof caches !== 'undefined') {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
        } catch(e) {}
        window.location.reload();
      }

      // Show reload button if loading takes more than 4.5 seconds
      setTimeout(function() {
        var btn = document.getElementById('preloader-reload-btn');
        if (btn) btn.style.display = 'inline-block';
      }, 4500);

      // Only disable Service Worker inside AI Studio development editor iframe (window.self !== window.top)
      var isInsideDevIframe = (window.self !== window.top) && (window.location.hostname.includes('ais-dev-') || window.location.hostname === 'localhost');

      if ('serviceWorker' in navigator) {
        if (isInsideDevIframe) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        } else {
          window.addEventListener('load', async function() {
            try {
              var hadController = Boolean(navigator.serviceWorker.controller);
              var swRefreshing = false;

              if (hadController) {
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                  if (!swRefreshing) {
                    swRefreshing = true;
                    window.location.reload();
                  }
                });
              }

              var registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
              console.log('Service Worker registrado com sucesso:', registration.scope);

              registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });

              registration.update().catch(function() {});

              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function() {});
                }
              });

              if ('SyncManager' in window) {
                try {
                  await registration.sync.register('database-sync');
                } catch (syncErr) {}
              }
            } catch (error) {
              console.warn('Aviso no registro do Service Worker:', error);
            }
          });
        }
      }
    </script>
